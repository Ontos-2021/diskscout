[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diskscout"
version = "0.1.0"
description = "Disk usage analyzer with CLI and Textual TUI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual==0.40.0",
    "send2trash>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
diskscout = "cli.main:main"

[tool.setuptools.packages.find]
include = ["assets*", "cli*", "core*", "tui*"]

[tool.setuptools.package-data]
"assets.strings" = ["*.json"]
